# noteのRSSを定期取得し、記事に変化があれば src/data/note-feed.json を更新してmainにpushする。
# mainへのpushでVercelの本番デプロイが走り、サイトの実践ログが最新化される（ラグ最大6時間）
name: Refresh note feed

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch note feeds
        run: node scripts/fetch-note-feed.mjs
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/note-feed.json; then
            echo "note feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/note-feed.json
          git commit -m "Update note feed snapshot"
          git push
