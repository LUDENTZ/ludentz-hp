<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" font-family="'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif">
  <title>判定基準——その業務、AIに何を渡せるか？</title>
  <rect width="900" height="506" fill="#FAFAF8"/>
  <text x="450" y="46" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="5" fill="#8A8A84">判定基準</text>

  <rect x="188" y="66" width="524" height="60" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.3"/>
  <text x="450" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#0A0A0A">その業務、AIに何を渡せるか？</text>

  <!-- arrows -->
  <line x1="310" y1="128" x2="196" y2="196" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M194,198 l11,-2 -6,-9 z" fill="#8A8A84"/>
  <line x1="450" y1="128" x2="450" y2="196" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M450,200 l-6,-10 h12 z" fill="#8A8A84"/>
  <line x1="590" y1="128" x2="700" y2="196" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M702,198 l-11,-2 6,-9 z" fill="#8A8A84"/>

  <!-- edge labels -->
  <text x="110" y="156" text-anchor="middle" font-size="12.5" fill="#55554F">判断が要る。</text>
  <text x="110" y="174" text-anchor="middle" font-size="12.5" fill="#55554F">作業しか渡せない</text>
  <text x="570" y="156" text-anchor="middle" font-size="12.5" fill="#55554F">やり方を説明できる。</text>
  <text x="570" y="174" text-anchor="middle" font-size="12.5" fill="#55554F">手順まで渡せる</text>
  <text x="795" y="156" text-anchor="middle" font-size="12.5" fill="#55554F">過程はどうでもいい。</text>
  <text x="795" y="174" text-anchor="middle" font-size="12.5" fill="#55554F">目的だけで足りる</text>

  <!-- COPILOT card -->
  <rect x="64" y="214" width="248" height="162" rx="6" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="84" y="246" font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#8A8A84">① 伴走型</text>
  <text x="84" y="276" font-size="18" font-weight="700" fill="#0A0A0A">作業を渡す</text>
  <text x="84" y="301" font-size="12.5" fill="#3A3A36">人が方向づけ、AIと往復して仕上げる</text>
  <text x="84" y="330" font-size="11.5" fill="#75756F">例：分析／企画／クリエイティブ／提案書</text>
  <text x="84" y="349" font-size="11.5" fill="#75756F">実装：業務手順のSkill化・配布</text>

  <!-- WORKFLOW card -->
  <rect x="326" y="214" width="248" height="162" rx="6" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="346" y="246" font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#8A8A84">② 固定ワークフロー</text>
  <text x="346" y="276" font-size="18" font-weight="700" fill="#0A0A0A">手順を渡す</text>
  <text x="346" y="301" font-size="12.5" fill="#3A3A36">無人のレールに載せ、人は見張るだけ</text>
  <text x="346" y="330" font-size="11.5" fill="#75756F">例：定時レポート／リード処理</text>
  <text x="346" y="349" font-size="11.5" fill="#75756F">実装：決定論パイプライン＋LLM工程</text>

  <!-- AGENT card -->
  <rect x="588" y="214" width="248" height="162" rx="6" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="608" y="246" font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#8A8A84">③ 委任型エージェント</text>
  <text x="608" y="276" font-size="18" font-weight="700" fill="#0A0A0A">目的を渡す</text>
  <text x="608" y="301" font-size="12.5" fill="#3A3A36">送り出して、成果だけ受け取る</text>
  <text x="608" y="330" font-size="11.5" fill="#75756F">例：常時リサーチ／アウトバウンド運用</text>
  <text x="608" y="349" font-size="11.5" fill="#75756F">実装：既製→カスタムのエージェント</text>

  <text x="450" y="446" text-anchor="middle" font-size="15" fill="#3A3A36">渡せる深さは、業務の言語化の深さで決まる。</text>
  <text x="840" y="492" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace" font-size="10" fill="#B5B3AD">LUDENTZ — Marketing AX</text>
</svg>
