<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" font-family="'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif">
  <title>判定基準——その業務、AIに何を渡せるか？</title>
  <rect width="900" height="506" fill="#0A0A0A"/>
  <text x="450" y="56" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace" font-size="10.5" letter-spacing="5" fill="#8a8a86">判定基準</text>

  <rect x="188" y="86" width="524" height="62" rx="8" fill="none" stroke="#e8e8e4" stroke-width="1.2"/>
  <text x="450" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#F5F5F2">その業務、AIに何を渡せるか？</text>

  <!-- arrows -->
  <line x1="310" y1="150" x2="196" y2="222" stroke="#6a6a70" stroke-width="1.3"/>
  <path d="M196,222 l10,-2 -6,-8 z" fill="#6a6a70"/>
  <line x1="450" y1="150" x2="450" y2="222" stroke="#6a6a70" stroke-width="1.3"/>
  <path d="M450,224 l-5,-9 h10 z" fill="#6a6a70"/>
  <line x1="590" y1="150" x2="700" y2="222" stroke="#6a6a70" stroke-width="1.3"/>
  <path d="M700,222 l-10,-2 6,-8 z" fill="#6a6a70"/>

  <!-- edge labels -->
  <text x="112" y="182" text-anchor="middle" font-size="10.5" fill="#9a9a96">判断が要る。</text>
  <text x="112" y="198" text-anchor="middle" font-size="10.5" fill="#9a9a96">作業しか渡せない</text>
  <text x="565" y="182" text-anchor="middle" font-size="10.5" fill="#9a9a96">やり方を説明できる。</text>
  <text x="565" y="198" text-anchor="middle" font-size="10.5" fill="#9a9a96">手順まで渡せる</text>
  <text x="790" y="182" text-anchor="middle" font-size="10.5" fill="#9a9a96">過程はどうでもいい。</text>
  <text x="790" y="198" text-anchor="middle" font-size="10.5" fill="#9a9a96">目的だけで足りる</text>

  <!-- COPILOT card -->
  <rect x="68" y="238" width="240" height="178" rx="6" fill="#15151a"/>
  <text x="88" y="268" font-family="'JetBrains Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#8a8a86">COPILOT</text>
  <text x="88" y="294" font-size="16" font-weight="700" fill="#F5F5F2">作業を渡す</text>
  <text x="88" y="318" font-size="10.5" fill="#b5b5b1">人が方向づけ、AIと往復して仕上げる</text>
  <text x="88" y="345" font-size="9.5" fill="#77777a">例：分析／企画／クリエイティブ／提案書</text>
  <text x="88" y="362" font-size="9.5" fill="#77777a">実装：業務手順のSkill化・配布</text>
  <line x1="88" y1="378" x2="288" y2="378" stroke="#2a2a30"/>
  <text x="88" y="398" font-size="10.5" font-weight="700" fill="#F5F5F2">渡すのは毎回</text>

  <!-- WORKFLOW card -->
  <rect x="330" y="238" width="240" height="178" rx="6" fill="#15151a"/>
  <text x="350" y="268" font-family="'JetBrains Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#8a8a86">WORKFLOW</text>
  <text x="350" y="294" font-size="16" font-weight="700" fill="#F5F5F2">手順を渡す</text>
  <text x="350" y="318" font-size="10.5" fill="#b5b5b1">無人のレールに載せ、人は見張るだけ</text>
  <text x="350" y="345" font-size="9.5" fill="#77777a">例：定時レポート／リード処理</text>
  <text x="350" y="362" font-size="9.5" fill="#77777a">実装：決定論パイプライン＋LLM工程</text>
  <line x1="350" y1="378" x2="550" y2="378" stroke="#2a2a30"/>
  <text x="350" y="398" font-size="10.5" font-weight="700" fill="#F5F5F2">渡すのは最初の一度</text>

  <!-- AGENT card -->
  <rect x="592" y="238" width="240" height="178" rx="6" fill="#15151a"/>
  <text x="612" y="268" font-family="'JetBrains Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#8a8a86">AGENT</text>
  <text x="612" y="294" font-size="16" font-weight="700" fill="#F5F5F2">目的を渡す</text>
  <text x="612" y="318" font-size="10.5" fill="#b5b5b1">送り出して、成果だけ受け取る</text>
  <text x="612" y="345" font-size="9.5" fill="#77777a">例：常時リサーチ／アウトバウンド運用</text>
  <text x="612" y="362" font-size="9.5" fill="#77777a">実装：既製→カスタムのエージェント</text>
  <line x1="612" y1="378" x2="812" y2="378" stroke="#2a2a30"/>
  <text x="612" y="398" font-size="10.5" font-weight="700" fill="#F5F5F2">渡すのはゴール単位</text>

  <text x="450" y="462" text-anchor="middle" font-size="13" fill="#c8c8c4">渡せる深さは、業務の言語化の深さで決まる。</text>
  <text x="840" y="488" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace" font-size="9" fill="#4a4a46">LUDENTZ — Marketing AX</text>
</svg>
