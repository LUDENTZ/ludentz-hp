<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" font-family="'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif">
  <title>WORKFLOWの実例——週次レポートライン</title>
  <rect width="900" height="506" fill="#FAFAF8"/>
  <text x="60" y="52" font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="3" fill="#8A8A84">02 WORKFLOW — 手順を渡す</text>
  <text x="60" y="94" font-size="26" font-weight="700" fill="#0A0A0A">実例：週次レポートライン</text>
  <text x="60" y="124" font-size="15" fill="#55554F">一度手順を渡せば、毎週月曜、無人で回る。人は見張るだけ</text>

  <!-- unmanned zone -->
  <text x="66" y="172" font-size="12" fill="#8A8A84">無人ゾーン（開始ボタンすら押さない）</text>
  <rect x="58" y="182" width="784" height="124" rx="8" fill="none" stroke="#B5B3AD" stroke-dasharray="5 5"/>

  <!-- nodes -->
  <rect x="70" y="202" width="136" height="84" rx="6" fill="#FFFFFF" stroke="#6B7FC7" stroke-width="1.5"/>
  <text x="138" y="238" text-anchor="middle" font-size="12.5" fill="#3E5296">毎週月曜 9:00</text>
  <text x="138" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0A0A">自動起動</text>

  <line x1="206" y1="244" x2="222" y2="244" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M226,244 l-9,-5 v10 z" fill="#8A8A84"/>

  <rect x="228" y="202" width="136" height="84" rx="6" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="296" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">媒体データ取得</text>
  <text x="296" y="262" text-anchor="middle" font-size="11" fill="#75756F">媒体横断・API</text>

  <line x1="364" y1="244" x2="380" y2="244" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M384,244 l-9,-5 v10 z" fill="#8A8A84"/>

  <rect x="386" y="202" width="136" height="84" rx="6" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="454" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">集計・グラフ化</text>
  <text x="454" y="262" text-anchor="middle" font-size="11" fill="#75756F">決定論的な処理</text>

  <line x1="522" y1="244" x2="538" y2="244" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M542,244 l-9,-5 v10 z" fill="#8A8A84"/>

  <rect x="544" y="202" width="136" height="84" rx="6" fill="#C9D4F4"/>
  <text x="612" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#12121A">考察ドラフト</text>
  <text x="612" y="262" text-anchor="middle" font-size="11" fill="#4A5070">ここだけLLM工程</text>

  <line x1="680" y1="244" x2="696" y2="244" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M700,244 l-9,-5 v10 z" fill="#8A8A84"/>

  <rect x="702" y="202" width="136" height="84" rx="6" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="770" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">Slackへ配信</text>
  <text x="770" y="262" text-anchor="middle" font-size="11" fill="#75756F">関係者に自動共有</text>

  <!-- watcher -->
  <circle cx="450" cy="398" r="46" fill="#FFFFFF" stroke="#8A8A84" stroke-dasharray="4 4"/>
  <text x="450" y="395" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0A0A">人</text>
  <text x="450" y="417" text-anchor="middle" font-size="11" fill="#55554F">見張るだけ</text>
  <line x1="482" y1="364" x2="596" y2="298" stroke="#8A8A84" stroke-dasharray="4 4"/>
  <path d="M598,296 l-11,3 6,8 z" fill="#8A8A84"/>
  <text x="618" y="348" font-size="12" fill="#55554F">異常値アラートが出たときだけ呼ばれる</text>

  <text x="60" y="478" font-size="14" fill="#3A3A36">レポーティング工数：1〜2時間×社数 → <tspan font-weight="700" fill="#3E5296">ほぼゼロ</tspan></text>
  <text x="840" y="492" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace" font-size="10" fill="#B5B3AD">LUDENTZ — Marketing AX</text>
</svg>
