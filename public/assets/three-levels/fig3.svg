<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" font-family="'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif">
  <title>COPILOTの実例——提案資料Skill</title>
  <rect width="900" height="506" fill="#FAFAF8"/>
  <text x="60" y="52" font-family="'JetBrains Mono',Menlo,monospace" font-size="12" letter-spacing="3" fill="#8A8A84">01 COPILOT — 作業を渡す</text>
  <text x="60" y="94" font-size="26" font-weight="700" fill="#0A0A0A">実例：提案資料Skill</text>
  <text x="60" y="124" font-size="15" fill="#55554F">過去の提案書の型を一度Skill化すれば、誰が使っても同じ品質で立ち上がる</text>

  <!-- asset card -->
  <rect x="60" y="168" width="212" height="128" rx="6" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="78" y="196" font-family="'JetBrains Mono',Menlo,monospace" font-size="11" letter-spacing="1" fill="#8A8A84">資産（一度だけ用意）</text>
  <text x="78" y="224" font-size="14" font-weight="700" fill="#0A0A0A">過去の提案書・構成</text>
  <text x="78" y="245" font-size="14" font-weight="700" fill="#0A0A0A">ルール・トンマナ</text>
  <text x="78" y="274" font-size="12" fill="#55554F">→「提案資料Skill」として配布</text>

  <line x1="272" y1="232" x2="322" y2="232" stroke="#8A8A84" stroke-width="1.4"/>
  <path d="M326,232 l-11,-6 v12 z" fill="#8A8A84"/>

  <!-- AI card -->
  <rect x="330" y="160" width="252" height="140" rx="8" fill="#C9D4F4"/>
  <text x="456" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#12121A">AI（Skillを装着）</text>
  <text x="456" y="222" text-anchor="middle" font-size="13.5" fill="#23232C">構成案 → 本文 → 図表 → 体裁</text>
  <text x="456" y="242" text-anchor="middle" font-size="13.5" fill="#23232C">を一気に生成</text>
  <text x="456" y="274" text-anchor="middle" font-size="11.5" fill="#4A5070">作業はAIが巻き取る</text>

  <!-- human circle -->
  <circle cx="722" cy="230" r="58" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.3"/>
  <text x="722" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#0A0A0A">人</text>
  <text x="722" y="250" text-anchor="middle" font-size="11.5" fill="#55554F">方向づけ・判断</text>

  <!-- arrows AI <-> human -->
  <line x1="582" y1="202" x2="656" y2="202" stroke="#3A3A36" stroke-width="1.3"/>
  <path d="M660,202 l-11,-6 v12 z" fill="#3A3A36"/>
  <text x="620" y="190" text-anchor="middle" font-size="11.5" fill="#55554F">ドラフト</text>
  <line x1="656" y1="258" x2="582" y2="258" stroke="#3A3A36" stroke-width="1.3"/>
  <path d="M578,258 l11,-6 v12 z" fill="#3A3A36"/>
  <text x="620" y="280" text-anchor="middle" font-size="11.5" fill="#55554F">骨子指示・修正</text>

  <!-- before/after band -->
  <rect x="60" y="352" width="780" height="96" rx="8" fill="#FFFFFF" stroke="#D8D6D1"/>
  <text x="96" y="388" font-size="12.5" fill="#8A8A84">Before</text>
  <text x="96" y="420" font-size="23" font-weight="700" fill="#0A0A0A">約6〜8時間</text>
  <line x1="322" y1="402" x2="388" y2="402" stroke="#6B7FC7" stroke-width="2.5"/>
  <path d="M394,402 l-14,-7 v14 z" fill="#6B7FC7"/>
  <text x="436" y="388" font-size="12.5" fill="#8A8A84">After</text>
  <text x="436" y="420" font-size="23" font-weight="700" fill="#3E5296">約30分</text>
  <text x="804" y="394" text-anchor="end" font-size="12.5" fill="#55554F">判断の質は落とさず、</text>
  <text x="804" y="414" text-anchor="end" font-size="12.5" fill="#55554F">作業時間だけを消す</text>

  <text x="840" y="492" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace" font-size="10" fill="#B5B3AD">LUDENTZ — Marketing AX</text>
</svg>
