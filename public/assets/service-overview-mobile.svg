<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">サービス全体像</title>
  <desc id="desc">スマートフォン向けのサービス全体像。1次ヒアリングから事業方針とアイデア提案、伴走型と事業譲渡型の選択、事業運営、希望時のアドバイザリーまでの流れ。</desc>
  <defs>
    <style>
      .label { fill: #0A0A0A; font-family: "Zen Old Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 28px; font-weight: 800; letter-spacing: 0.03em; }
      .label-small { fill: #0A0A0A; font-family: "Zen Old Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 24px; font-weight: 800; letter-spacing: 0.03em; }
      .sub { fill: rgba(10,10,10,0.7); font-family: "Zen Old Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 18px; font-weight: 800; letter-spacing: 0.03em; }
      .body { fill: rgba(10,10,10,0.62); font-family: "Zen Old Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 14px; font-weight: 700; letter-spacing: 0.03em; }
      .note { fill: rgba(10,10,10,0.56); font-family: "Zen Old Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 14px; font-weight: 700; letter-spacing: 0.03em; }
      .num { fill: #0A0A0A; font-family: "Zen Old Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 23px; font-weight: 800; }
      .line { fill: none; stroke: #0A0A0A; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; }
      .muted-line { fill: none; stroke: rgba(10,10,10,0.16); stroke-width: 1.1; }
      .soft-line { fill: none; stroke: rgba(10,10,10,0.34); stroke-width: 1.5; }
      .panel { fill: none; stroke: rgba(10,10,10,0.18); stroke-width: 1.1; }
    </style>
  </defs>

  <g transform="translate(48 54)">
    <rect class="panel" x="0" y="0" width="624" height="1168" rx="0"/>
    <line class="muted-line" x1="44" y1="176" x2="580" y2="176"/>
    <line class="muted-line" x1="44" y1="440" x2="580" y2="440"/>

    <g transform="translate(54 66)">
      <text class="num" x="0" y="28">01</text>
      <text class="label" x="54" y="30">1次ヒアリング</text>
      <text class="sub" x="54" y="68">無料・1時間</text>
      <text class="body" x="54" y="108">
        <tspan x="54" dy="0">事前フォームをもとに、既存事業の強み・弱み、</tspan>
        <tspan x="54" dy="26">技術アセット、販売チャネル、人的リソースを確認します。</tspan>
      </text>
    </g>

    <g transform="translate(300 196)">
      <line class="soft-line" x1="0" y1="0" x2="0" y2="48"/>
      <text class="note" x="26" y="32">1〜2週間</text>
    </g>

    <g transform="translate(54 282)">
      <text class="num" x="0" y="28">02</text>
      <text class="label" x="54" y="30">事業方針 + アイデア提案</text>
      <text class="sub" x="54" y="68">無料・1時間</text>
      <text class="body" x="54" y="108">
        <tspan x="54" dy="0">既存領域と周辺領域を調査し、事業アイデア3案を提示します。</tspan>
        <tspan x="54" dy="26">ここまで無料です。</tspan>
        <tspan x="54" dy="26">事業化に向けて取り組み可能とご判断の場合、</tspan>
        <tspan x="54" dy="26">有償の伴走支援をご提案。</tspan>
      </text>
    </g>

    <line class="line" x1="312" y1="492" x2="312" y2="540"/>
    <path class="line" d="M150 540 H474"/>
    <line class="line" x1="150" y1="540" x2="150" y2="584"/>
    <line class="line" x1="474" y1="540" x2="474" y2="584"/>

    <g transform="translate(54 650)">
      <text class="num" x="0" y="28">03</text>
      <text class="label" x="54" y="30">伴走型</text>
      <text class="sub" x="54" y="68">8か月 / 3プラン</text>
      <text class="body" x="54" y="108">
        <tspan x="54" dy="0">支援内容を具体化し、LUDENTZがチームの一員として</tspan>
        <tspan x="54" dy="26">前に進めます。</tspan>
      </text>
    </g>

    <line class="muted-line" x1="44" y1="814" x2="580" y2="814"/>

    <g transform="translate(54 862)">
      <text class="num" x="0" y="28">03</text>
      <text class="label" x="54" y="30">事業譲渡型</text>
      <text class="note" x="54" y="70">※対象となる企業は限定されます（後述）</text>
    </g>

    <line class="soft-line" x1="150" y1="728" x2="150" y2="960"/>
    <line class="soft-line" x1="150" y1="728" x2="150" y2="982"/>

    <g transform="translate(108 1016)">
      <text class="num" x="0" y="28">04</text>
      <text class="label-small" x="54" y="30">事業運営</text>
      <text class="sub" x="54" y="68">クライアント</text>
    </g>

    <g transform="translate(108 1122)">
      <text class="note" x="0" y="0">希望時</text>
      <text class="label-small" x="92" y="0">アドバイザリー</text>
    </g>
  </g>
</svg>
